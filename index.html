<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#sportsbetting - VALUE FINDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-pink: #ff00ff; --neon-cyan: #00ffff; --dark-bg: #090014; --brand-orange: #ff5733; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Share Tech Mono', monospace; min-height: 100vh; overflow-x: hidden; padding-bottom: 20px; }
        header { width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon-cyan); }
        .logo-home { text-decoration: none; font-family: 'Righteous', cursive; font-size: 2rem; color: var(--neon-pink); display: flex; align-items: center; text-shadow: 0 0 10px var(--neon-pink); }
        .sports-icons-header { font-size: 0.55em; margin-left: 5px; }
        .btn-subscribe { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        main { display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .slot-title { font-family: 'Righteous', cursive; font-size: 2rem; margin: 5px 0; text-shadow: 2px 2px var(--neon-pink); text-align: center; }
        .slot-machine-container { background: #110022; padding: 10px; border: 3px solid var(--neon-pink); border-radius: 10px; width: 100%; max-width: 450px; }
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #000; padding: 5px; border-radius: 5px; }
        .reel-column { height: 210px; overflow: hidden; border: 1px solid var(--neon-cyan); background: #050010; }
        .reel-strip { font-size: 3rem; line-height: 70px; text-align: center; display: flex; flex-direction: column; }
        @keyframes dynamic-spin { 0% { transform: translateY(0); } 100% { transform: translateY(-560px); } }
        .fast-spinning { animation: dynamic-spin 0.2s linear infinite; filter: blur(3px); }
        .bet-card { margin-top: 10px; width: 100%; padding: 10px; border: 1px solid var(--neon-cyan); background: rgba(0,255,255,0.05); display: none; }
        .btn-unlock { margin-top: 10px; width: 100%; background-color: var(--neon-pink); color: #fff; padding: 10px; font-family: 'Righteous', cursive; font-size: 1.2rem; border: none; border-radius: 5px; text-align: center; display: block; animation: pulse 2s infinite; }
        .btn-generate { margin-top: 15px; padding: 12px 30px; font-family: 'Righteous', cursive; font-size: 1.5rem; background: var(--neon-cyan); border: none; border-radius: 5px; color: #000; cursor: pointer; }
        @keyframes pulse { 0% { box-shadow: 0 0 10px var(--neon-pink); } 50% { box-shadow: 0 0 25px var(--neon-pink); } 100% { box-shadow: 0 0 10px var(--neon-pink); } }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo-home"># <span class="sports-icons-header">🎾🏀🏐</span></a>
        <a href="results.html" class="btn-subscribe">RESULTS</a>
    </header>
    <main>
        <div class="slot-title" id="main-title">PREDICTION OF THE DAY</div>
        <div class="slot-machine-container" id="main-slot">
            <div class="grid-3x3">
                <div class="reel-column"><div class="reel-strip" id="reel1"><div>🏀</div><div>🎾</div><div>🏐</div><div>🏀</div><div>🎾</div><div>🏐</div><div>🎾</div></div></div>
                <div class="reel-column"><div class="reel-strip" id="reel2"><div>🎾</div><div>🏐</div><div>🏀</div><div>🎾</div><div>🏐</div><div>🏀</div><div>🎾</div></div></div>
                <div class="reel-column"><div class="reel-strip" id="reel3"><div>🏐</div><div>🏀</div><div>🎾</div><div>🏐</div><div>🏀</div><div>🎾</div><div>🎾</div></div></div>
            </div>
            <div id="bet-card" class="bet-card">
                <div style="display:flex; justify-content:space-between; align-items: center;">
                    <span style="font-size: 0.9rem;">Player A vs Player B</span>
                    <span style="color:var(--neon-cyan); font-size: 1.3rem;">@ 2.10</span>
                </div>
                <a href="https://whop.com/checkout" class="btn-unlock">🔓 UNLOCK - 4,90€</a>
            </div>
        </div>
        <button id="btn-generate" class="btn-generate">GENERATE</button>
    </main>
    <script>
        const reels = document.querySelectorAll('.reel-strip');
        const btnGenerate = document.getElementById('btn-generate');
        const title = document.getElementById('main-title');
        btnGenerate.addEventListener('click', function() {
            this.style.display = 'none';
            let status = 'active'; // Change à 'too_late' pour tester
            reels.forEach(r => r.classList.add('fast-spinning'));
            setTimeout(() => {
                reels.forEach(r => { r.classList.remove('fast-spinning'); r.style.transform = 'translateY(-350px)'; });
                if(status === 'active') {
                    title.innerText = "VALUE FOUND"; title.style.color = "var(--neon-cyan)";
                    document.getElementById('bet-card').style.display = 'block';
                } else {
                    title.innerText = "VALUE FOUND";
                    document.getElementById('bet-card').innerHTML = `<div style="text-align:center; color:#ff4444; font-family:'Righteous',cursive;">MATCH ENDED | TOO LATE</div>`;
                    document.getElementById('bet-card').style.display = 'block';
                }
            }, 2000);
        });
    </script>
</body>
</html>
