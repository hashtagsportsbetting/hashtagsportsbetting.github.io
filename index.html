<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#sportsbetting - VALUE FINDER</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --neon-pink: #ff00ff; --neon-cyan: #00ffff; --dark-bg: #090014; --grid-color: rgba(0, 255, 255, 0.05); --brand-orange: #ff5733; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--dark-bg); color: #fff; font-family: 'Share Tech Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; }
        header { width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon-cyan); background: rgba(9, 0, 20, 0.9); }
        .logo-home { text-decoration: none; font-family: 'Righteous', cursive; font-size: 2.2rem; color: var(--neon-pink); }
        .btn-subscribe { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 8px 12px; border-radius: 4px; text-transform: uppercase; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 15px 10px; }
        .slot-title { font-family: 'Righteous', cursive; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 2px 2px var(--neon-pink); text-align: center; }
        .slot-machine-container { background: #110022; padding: 10px; border: 3px solid var(--neon-pink); border-radius: 10px; width: 100%; max-width: 450px; }
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #000; padding: 5px; border-radius: 5px; border: 2px solid #333; }
        .reel-column { height: 270px; overflow: hidden; border: 1px solid var(--neon-cyan); border-radius: 4px; background: #050010; }
        .reel-strip { font-size: 3.5rem; line-height: 90px; text-align: center; display: flex; flex-direction: column; }
        @keyframes dynamic-spin { 0% { transform: translateY(0); } 100% { transform: translateY(-810px); } }
        .fast-spinning { animation: dynamic-spin 0.2s linear infinite; filter: blur(3px); }
        .stopping-phase { transition: transform 0.6s cubic-bezier(0.1, 0.9, 0.2, 1); filter: none; }
        .bet-card { margin-top: 10px; width: 100%; padding: 15px; border: 1px solid var(--neon-cyan); background: rgba(0, 255, 255, 0.05); display: none; }
        .btn-unlock { margin-top: 10px; width: 100%; background-color: var(--neon-pink); color: #fff; padding: 12px; font-family: 'Righteous', cursive; font-size: 1.2rem; border: none; border-radius: 5px; text-align: center; display: block; animation: pulse 2s infinite; cursor: pointer; }
        .alert-form { margin-top: 15px; width: 100%; max-width: 450px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; background: #000; border: 1px solid var(--neon-cyan); color: #fff; border-radius: 4px; }
        .btn-generate { margin-top: 15px; padding: 12px 35px; font-family: 'Righteous', cursive; font-size: 1.5rem; background: var(--neon-cyan); border: none; cursor: pointer; border-radius: 5px; color: #000; }
        footer { width: 100%; padding: 15px; text-align: center; border-top: 1px solid #222; color: #888; font-size: 0.85rem; margin-top: auto; }
        @keyframes pulse { 0% { box-shadow: 0 0 10px var(--neon-pink); } 50% { box-shadow: 0 0 25px var(--neon-pink); } 100% { box-shadow: 0 0 10px var(--neon-pink); } }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo-home"># <span style="font-size:0.5em">🎾🏀🏐</span></a>
        <a href="results.html" class="btn-subscribe">RESULTS</a>
    </header>
    <main>
        <div class="slot-title" id="main-title">PREDICTION OF THE DAY</div>
        <div class="slot-machine-container" id="main-slot">
            <div class="grid-3x3">
                <div class="reel-column"><div class="reel-strip" id="reel1"><div>🏀</div><div>🎾</div><div>🏐</div><div>🏀</div><div class="target-symbol">🎾</div><div>🏐</div></div></div>
                <div class="reel-column"><div class="reel-strip" id="reel2"><div>🏐</div><div>🏀</div><div>🎾</div><div>🏐</div><div class="target-symbol">🎾</div><div>🏀</div></div></div>
                <div class="reel-column"><div class="reel-strip" id="reel3"><div>🎾</div><div>🏐</div><div>🏀</div><div>🎾</div><div class="target-symbol">🎾</div><div>🏐</div></div></div>
            </div>
            <div id="bet-card" class="bet-card"></div>
        </div>
        <form action="https://hooks.zapier.com/hooks/catch/28613327/4tfmq4u/" method="POST" class="alert-form">
            <input type="email" name="email" placeholder="Enter email for new alerts" required>
            <button type="submit" class="btn-subscribe">SUBSCRIBE</button>
        </form>
        <button id="btn-generate" class="btn-generate">GENERATE</button>
    </main>
    <footer><p>&copy; 2026 HashtagSportsBetting.com</p></footer>
    <script>
        const reels = document.querySelectorAll('.reel-strip');
        const btnGenerate = document.getElementById('btn-generate');
        const betCard = document.getElementById('bet-card');
        const title = document.getElementById('main-title');
        btnGenerate.addEventListener('click', function() {
            this.style.display = 'none';
            let status = 'too_late'; 
            reels.forEach(r => r.classList.add('fast-spinning'));
            setTimeout(() => {
                reels.forEach(r => { r.classList.remove('fast-spinning'); r.style.transform = 'translateY(-360px)'; r.classList.add('stopping-phase'); });
                if(status === 'active') {
                    title.innerText = "VALUE FOUND";
                    betCard.innerHTML = `<div style="display:flex; justify-content:space-between;"><span style="color:#aaa;">Djokovic vs Alcaraz</span><span style="color:var(--neon-cyan);">@ 2.10</span></div><a href="https://whop.com/checkout" class="btn-unlock">🔓 UNLOCK - 4,90€</a>`;
                    betCard.style.display = 'block';
                } else {
                    title.innerText = "VALUE FOUND";
                    betCard.innerHTML = `<div style="text-align:center; color:#ff4444; font-weight:bold; font-family:'Righteous',cursive;">MATCH ENDED | TOO LATE</div>`;
                    betCard.style.display = 'block';
                }
            }, 2000);
        });
    </script>
</body>
</html>
