<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Le hashtag blanc -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <line x1="22" y1="42" x2="102" y2="42" />
    <line x1="18" y1="78" x2="98" y2="78" />
    <line x1="54" y1="18" x2="38" y2="102" />
    <line x1="82" y1="18" x2="66" y2="102" />
  </g>

  <!-- Balle de Tennis (Haut Gauche) -->
  <g transform="translate(36, 30)">
    <circle cx="0" cy="0" r="10.5" fill="#D1E043" />
    <path d="M -6.5 -7.5 A 8 8 0 0 0 -6.5 7.5" fill="none" stroke="#111" stroke-width="1.2" />
    <path d="M 6.5 -7.5 A 8 8 0 0 1 6.5 7.5" fill="none" stroke="#111" stroke-width="1.2" />
  </g>

  <!-- Ballon de Basket (Centre) -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="10.5" fill="#E66C2C" />
    <line x1="-10.5" y1="0" x2="10.5" y2="0" stroke="#111" stroke-width="1.2" />
    <line x1="0" y1="-10.5" x2="0" y2="10.5" stroke="#111" stroke-width="1.2" />
    <path d="M -6.5 -8 A 8 8 0 0 1 -6.5 8" fill="none" stroke="#111" stroke-width="1.2" />
    <path d="M 6.5 -8 A 8 8 0 0 0 6.5 8" fill="none" stroke="#111" stroke-width="1.2" />
  </g>

  <!-- Ballon de Volley (Bas Droite) -->
  <g transform="translate(84, 90)">
    <circle cx="0" cy="0" r="10.5" fill="#ffffff" />
    <path d="M -10.5 0 A 10.5 10.5 0 0 1 10.5 0" fill="#FFD700" />
    <path d="M -10.5 0 A 10.5 10.5 0 0 0 10.5 0" fill="#00509E" />
    <path d="M -8.5 -6 Q 0 0 8.5 -6" fill="none" stroke="#111" stroke-width="1.2" />
    <path d="M -8.5 6 Q 0 0 8.5 6" fill="none" stroke="#111" stroke-width="1.2" />
    <circle cx="0" cy="0" r="10.5" fill="none" stroke="#111" stroke-width="1.2" />
  </g>
</svg>
